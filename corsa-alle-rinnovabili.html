<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Corsa alle Rinnovabili | Data & Stories</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc; /* Sfondo chiaro */
            color: #1e293b;
            margin: 0;
            padding: 0;
            line-height: 1.8;
        }

        /* CONTENITORE PRINCIPALE CENTRATO */
        .article-container {
            max-width: 1050px;
            margin: 40px auto 60px;
            padding: 0 20px;
        }

        /* LINK TORNA ALLA HOME */
        .back-link {
            display: inline-block;
            color: #0f172a;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            margin-bottom: 24px;
            transition: color 0.2s ease;
        }

        .back-link:hover {
            color: #2563eb;
        }

        /* SCHEDA PULITA CHE RACCHIUDE L'ANALISI STREAMLIT */
        .iframe-wrapper {
            width: 100%;
            background-color: #ffffff;
            border-radius: 16px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            overflow: hidden;
        }

        .iframe-wrapper iframe {
            width: 100%;
            /* Altezza fissa generosa per contenere tutti i grafici ed evitare lo scroll interno */
            height: 2800px; 
            border: none;
            display: block;
        }

        /* PER SCHERMI PICCOLI / MOBILE */
        @media (max-width: 768px) {
            .article-container {
                margin: 20px auto;
                padding: 0 12px;
            }
            .iframe-wrapper iframe {
                height: 3800px; /* Su mobile l'app si allunga verticalmente */
            }
        }
    </style>
</head>
<body>

    <main class="article-container">
        <!-- LINK TORNA ALLA HOME -->
        <a href="index.html" class="back-link">&larr; Torna alla Home</a>
    
        <!-- SCHEDA DELL'ANALISI STREAMLIT -->
        <div class="iframe-wrapper">
            <iframe 
                src="https://corsaallerinnovabili.streamlit.app/?embed=true#sezione-6" 
                loading="lazy">
            </iframe>
        </div>
    </main>

</body>
</html>
